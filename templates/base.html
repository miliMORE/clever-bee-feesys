<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clever Bee Fees System</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,'Helvetica Neue',Arial,sans-serif;margin:0;padding:2rem;background:#0f172a;color:#e2e8f0}
    .card{max-width:760px;margin:0 auto;background:#111827;border:1px solid #1f2937;border-radius:16px;padding:24px}
    h1{margin:0 0 12px 0;font-size:1.5rem}
    .ok{display:inline-block;background:#065f46;color:#ecfdf5;padding:.25rem .5rem;border-radius:.5rem;font-weight:600}
    a{color:#93c5fd}
  </style>
</head>
<body>
  <div class="card">
    <h1>Clever Bee Fees System</h1>
    {% block content %}{% endblock %}
  </div>
</body>
</html>
